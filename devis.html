<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <title>Devis Maimaim-poana - BTP Artisan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="bg-slate-950/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-black text-amber-500">BTP<span class="text-white">ARTISAN</span></a>
      <a href="index.html" class="text-sm text-amber-400 font-semibold">← Hiverina amin'ny fandraisana</a>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-6 py-20 space-y-8">
    <h1 class="text-4xl font-extrabold text-amber-400 text-center">Fangatahana Devis Maimaim-poana</h1>
    <form id="devisForm" class="bg-slate-950 p-8 rounded-2xl border border-slate-800 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Anarana feno</label>
        <input type="text" id="dName" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Karazan'asa (Fanorenana, Rénovation, sns.)</label>
        <input type="text" id="dService" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Telefaonina na Email</label>
        <input type="text" id="dContact" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Antsipirian'ny tetikasa</label>
        <textarea id="dDetails" rows="4" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 outline-none focus:border-amber-500"></textarea>
      </div>
      <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-3.5 rounded-xl hover:bg-amber-400 transition">Alefaso ny Fangatahana</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
